name: PR Validation

on:
  pull_request:
    branches: [ develop ]

jobs:
  lint:
    name: Lint HTML and CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install linters
        run: npm install -g htmlhint stylelint stylelint-config-standard

      - name: Lint HTML
        run: htmlhint src/**/*.html

      - name: Lint CSS
        run: |
          echo '{ "extends": "stylelint-config-standard" }' > stylelint.config.json
          stylelint "**/*.css"

  build:
    name: Build Site
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Parcel
        run: npm install -g parcel

      - name: Build project
        run: parcel build src/index.html
